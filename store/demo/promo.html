<!doctype html>
<!-- Small promo tile, 440x280 (headless Edge, --window-size=440,280 --force-device-scale-factor=1). -->
<html lang="nb">
<head>
  <meta charset="utf-8">
  <title>Promo</title>
  <style>
    :root { --ink: #1d2433; --muted: #5d6677; --line: #dde1e8; --bg: #f4f6f9; --accent: #2457c5; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 440px; height: 280px; }
    body { background: var(--bg); color: var(--ink); font: 16px/1.4 system-ui, "Segoe UI", sans-serif;
           padding: 26px 28px; display: flex; flex-direction: column; justify-content: space-between; }
    .top { display: flex; align-items: center; gap: 16px; }
    .top img { width: 84px; height: 84px; display: block; }
    .name { font-size: 31px; font-weight: 700; letter-spacing: -0.015em; line-height: 1.1; }
    .tag { margin-top: 6px; font-size: 15px; color: var(--muted); }
    .ex { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; }
    .row { display: flex; align-items: baseline; gap: 12px; font-size: 18px; }
    .row + .row { margin-top: 4px; }
    .lbl { flex: 0 0 48px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
    .after .lbl { color: var(--accent); }
    .after { font-weight: 600; }
  </style>
</head>
<body>
  <div class="top">
    <img src="../../icons/icon_128.png" alt="">
    <div>
      <div class="name">Hen → han/hun</div>
      <div class="tag">For norske nettsider</div>
    </div>
  </div>
  <div class="ex">
    <div class="row"><span class="lbl">Før</span><span>Jeg møtte hen i går.</span></div>
    <div class="row after"><span class="lbl">Etter</span><span>Jeg møtte ham/henne i går.</span></div>
  </div>
</body>
</html>
