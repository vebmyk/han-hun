<!doctype html>
<!-- Store screenshot of the settings popup, 1280x800. popup.png is options.html rendered at 2x with
     chrome.storage stubbed to its defaults (headless Edge, window 552x379, --force-device-scale-factor=2). -->
<html lang="nb">
<head>
  <meta charset="utf-8">
  <title>Innstillinger</title>
  <style>
    :root { --ink: #1d2433; --muted: #5d6677; --bg: #f4f6f9; --accent: #2457c5; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1280px; height: 800px; }
    body { background: var(--bg); color: var(--ink); font: 20px/1.5 system-ui, "Segoe UI", sans-serif;
           display: flex; align-items: center; padding: 0 80px; gap: 56px; }
    .text { flex: 0 0 360px; }
    h1 { margin: 0 0 18px; font-size: 42px; line-height: 1.12; letter-spacing: -0.015em; }
    p { margin: 0 0 14px; color: var(--muted); }
    .accent { width: 56px; height: 5px; border-radius: 3px; background: var(--accent); margin-bottom: 22px; }
    .popup { flex: 0 0 690px; height: 450px; overflow: hidden; background: #fff; border-radius: 10px;
             box-shadow: 0 1px 2px rgba(20, 30, 50, .12), 0 18px 48px rgba(20, 30, 50, .22); }
    .popup img { display: block; width: 690px; height: auto; }
  </style>
</head>
<body>
  <div class="text">
    <div class="accent"></div>
    <h1>Du velger hvordan det skrives</h1>
    <p>Han/hun, han eller hun, alltid han, alltid hun, vedkommende, eller tilfeldig per side.</p>
    <p>Slå av enkeltnettsteder, eller hopp over språksjekken.</p>
  </div>
  <div class="popup"><img src="popup.png" alt="Innstillinger"></div>
</body>
</html>
